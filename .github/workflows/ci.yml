name: CI

# Runs the same checks a developer runs locally, so a PR cannot merge with a
# broken build even if the contributor has not installed the pre-commit hook
# (see .pre-commit-config.yaml).
on:
  push:
    branches: [main]
  pull_request:
  # Allows a run to be kicked off by hand from the Actions tab, which is handy
  # for confirming a fix without pushing an empty commit.
  workflow_dispatch:

# A new push to the same branch cancels an in-progress run for it. The test job
# takes ~15 minutes, so without this a branch with several quick pushes queues
# up runs that are already obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting and type checking finish in well under a minute,
  # so they run as their own job rather than making you wait for the test suite
  # to find out you forgot to run `ruff format`.
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Blocking: the repo is kept formatted and this passes today. Scope is the
      # whole repo, matching `ruff check` below -- docs/img/make_illustrations.py
      # is the only Python file outside src/ and tests/, and it is already
      # formatted, so there is no reason for the two to disagree on scope.
      - name: ruff format --check
        run: uv run ruff format --check .

      # Blocking: passes today. Includes tests/ deliberately. tests/ is a package
      # (see tests/__init__.py) whose shared helpers resolve via
      # [tool.ty.environment] extra-paths in pyproject.toml, and a src/-only
      # check cannot see a break in that wiring -- exactly the regression that
      # made this widening worth doing.
      - name: ty check
        run: uv run ty check src/ tests/

      # Blocking as of the lint cleanup that cleared the last 25 findings.
      # `--output-format=github` emits a `::error` annotation per finding, which
      # is what puts a new one directly on the offending line of the diff. That
      # was previously avoided only because ~86 pre-existing findings would have
      # decorated every PR with red marks for issues nobody introduced; with a
      # clean baseline, every annotation is now genuinely actionable.
      #
      # This is kept in step with the `ruff-check` hook in
      # .pre-commit-config.yaml so a commit that passes locally also passes here.
      - name: ruff check
        run: uv run ruff check . --output-format=github

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite takes ~11 minutes, dominated by test020_calvin_solutions.py
    # (~160s per test x 11 tests: roughly half in fit_phase_line and half in
    # matplotlib rendering). 30 gives headroom on a slow runner without letting
    # a genuinely hung test burn Actions minutes for hours.
    timeout-minutes: 30
    strategy:
      # Report every version's result rather than cancelling the rest on the
      # first failure - a version-specific break is exactly what the matrix is
      # for, and we want to see which ones.
      fail-fast: false
      matrix:
        # pyproject requires >=3.12,<3.15. 3.12 is what runs in production at
        # the MRO; 3.13 is here to catch breakage before we upgrade. Add "3.14"
        # once mwalib and the scientific stack publish wheels for it.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # The `integration` marked tests need network access and real external
      # binaries (giant-squid), so they are deselected by the `addopts` in
      # pyproject.toml and are NOT run here. Everything else is self-contained:
      # test configs are rendered per-test with stub binaries, and the scratch
      # tree location comes from MWAX_MOVER_TEST_DIR (defaulting to a temp dir).
      - name: pytest
        env:
          MWAX_MOVER_TEST_DIR: ${{ runner.temp }}/mwax_mover_testing
        run: uv run pytest
