[project]
name = "mwax_mover"
version = "1.10.1"
description = "A module to manage input, archiving and calibration for the MWAX correlator"
readme = "README.md"
requires-python = ">=3.12, <3.15"
keywords = ["MWA", "MWAX", "radioastronomy", "radiotelescope"]
authors = [
    { email = "greg.sleap@curtin.edu.au" },
    { name = "Greg Sleap" },
    { email = "dev.null@curtin.edu.au" },
    { name = "Dev Null" },
]
maintainers = [{ email = "greg.sleap@curtin.edu.au" }, { name = "Greg Sleap" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "astropy",
    "flask",
    "inotify",
    "matplotlib",
    "mwalib>=2.0.3",
    "pandas",
    "psycopg[binary]",
    "psycopg[pool]",
    "redis>=7.1.1",
    "requests",
    "scipy",
    "seaborn",
    "tenacity",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[project.urls]
homepage = "https://github.com/MWATelescope/mwax_mover"
documentation = "https://github.com/MWATelescope/mwax_mover"
repository = "https://github.com/MWATelescope/mwax_mover"
changelog = "https://github.com/MWATelescope/mwax_mover/CHANGELOG.md"

[project.scripts]
mwax_calvin_processor = "mwax_mover.cli.mwax_calvin_processor:main"
mwax_calvin_controller = "mwax_mover.cli.mwax_calvin_controller:main"
mwax_subfile_distributor = "mwax_mover.cli.mwax_subfile_distributor:main"
mwacache_archiver = "mwax_mover.cli.mwacache_archive_processor:main"
fits_inspect = "mwax_mover.cli.fits_inspect:main"
cal_utils = "mwax_mover.cli.cal_utils:main"
vdif_cat = "mwax_mover.cli.vdif_cat:main"
generate_index_json = "mwax_mover.cli.generate_index_json:main"
update_calvin_plots_and_index = "mwax_mover.cli.update_calvin_plots_and_index:main"
print_metafits_info = "mwax_mover.cli.print_metafits_info:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Starting set. E/F are pycodestyle+pyflakes (the ruff default) and B is
# flake8-bugbear. ARG, RET and SIM are worth adding once the existing
# findings in those categories have been worked through.
select = ["E", "F", "B"]

[tool.ruff.format]
# The whole of src/ and tests/ is kept formatted by `ruff format` at the
# line-length above. This is enforced automatically by the ruff-format
# pre-commit hook (see .pre-commit-config.yaml); to set it up in a fresh
# clone run:
#
#     uv run pre-commit install
#
# To format or check by hand:
#
#     ruff format src/ tests/
#     ruff format --check src/ tests/     # non-mutating, for CI
#
# These are ruff's defaults, stated explicitly so the intended style is
# recorded in the repo rather than being implicit in whatever ruff version
# happens to be installed.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.uv]
package = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(name)s.%(funcName)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
# Our test modules are named testNNN_*.py, which does NOT match pytest's
# default python_files patterns (test_*.py / *_test.py). Without this,
# `pytest` collects zero tests and exits successfully.
python_files = ["test*.py"]
# Be more verbose and never truncate asserts. Deliberately no -x: a full run
# should report every failure, not stop at the first. Pass -x on the command
# line when iterating on a single failure.
addopts = "-vv -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: requires network access or real external binaries (giant-squid, etc). Deselected by default; run with `pytest -m integration`.",
]
